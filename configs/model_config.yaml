# Model paths, target LLM specifications, and tree structures

# configs/model_config.yaml

target_model:
  name: "lmsys/vicuna-7b-v1.5"
  path: "path/to/vicuna"

  # Model dimensions
  hidden_size: 4096
  vocab_size: 32000

eagle:
  feature_dim: 4096
  embedding_dim: 4096

  # Concatenated [feature ; token_embedding]
  concat_dim: 8192

  decoder_hidden_size: 4096

  # Draft decoder layer (LLaMA-style, matched to Vicuna-7B)
  num_layers: 1
  num_heads: 32
  intermediate_size: 11008
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-6

draft_tree:
  # Complete tree: each node expands to its top_k most likely tokens, for `depth` levels.
  # Size is top_k + top_k^2 + ... + top_k^depth nodes, all scored in one target pass.
  # Starting values, to be tuned once a trained head is available.
  top_k: 3
  depth: 4
